<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>不動産ツール</title>
<meta name="description" content="相場を調べる、物件を調べる、資料を作る、お金を計算する不動産の道具。">
<meta name="theme-color" content="#040D1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="不動産ツール">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="共通/icons/app-180.png">
<link rel="icon" type="image/png" href="共通/icons/app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap">
<link rel="stylesheet" href="共通/home.css?v=7c5d2c34">
</head>
<body>
<div class="wall" aria-hidden="true"></div>
<main>
  <header class="top">
    <div class="logo"><b>不動産ツール</b><small>REAL ESTATE TOOLS</small></div>
    <div class="date" id="today"></div>
    <button type="button" class="iconbtn" id="add" aria-label="道具を追加"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6v20M6 16h20"/></svg></button>
    <button type="button" class="iconbtn" id="edit" aria-label="並べ替え"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 9h20M6 16h20M6 23h20"/><path d="M11 6v6M21 13v6M13 20v6"/></svg></button>
    <button type="button" class="textbtn" id="done" hidden>完了</button>
  </header>
  <div class="apps" id="grid"></div>
  <button type="button" class="hint" id="hint">追加した道具は、上から順に増えます。<br>長押しすると、好きな場所へ動かせます。</button>
</main>
<div class="tray"><div class="dockbox"><nav class="dock" id="dock" aria-label="ドック（無料の道具）"></nav></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="共通/tools.js?v=7c5d2c34"></script>
<script src="共通/home.js?v=7c5d2c34"></script>
</body>
</html>
