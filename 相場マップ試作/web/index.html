<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相場マップ（売買・賃貸）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../../共通/common.css?v=192f0179">
<style>
  /* 地図のページだけの形（色・文字は共通の決まりを使う） */
  html, body { height: 100%; }
  body { font-size: 14px; }
  #app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }   /* 列を画面の幅までにする（メニューの1行の長さでページが広がらないように） */
  header.bar { padding: 12px 16px 10px; border-bottom: 1px solid var(--rule); background: var(--paper); }
  .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .title h1 { font-size: 20px; margin: 0; }
  .title .sub { color: var(--muted); font-size: 12px; }
  #toggleFilters { margin-left: auto; display: none; }
  .areapick { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: end; }
  .areapick label, .filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-2); gap: 3px; }
  .areapick select { width: auto; max-width: 200px; font-size: 13px; padding: 5px 8px; }
  .areapick label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 12px; padding-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  .circlepick { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; align-items: end; }
  .circlepick label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-2); gap: 3px; }
  .circlepick select, .circlepick input { font-size: 13px; padding: 5px 8px; }
  .circlepick input { width: 15em; max-width: 100%; }
  .circlepick .btn { min-height: 32px; }
  .circlepick .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kmchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .kmchips label { flex-direction: row; align-items: center; gap: 3px; font-size: 13px; color: var(--ink); border: 1px solid var(--rule-strong); padding: 4px 8px; background: #fff; cursor: pointer; }
  .kmchips label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kmchips input { width: auto; padding: 0; margin: 0; }
  .kmgroup { font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
  .layerbox { position: absolute; top: 10px; right: 10px; z-index: 900; background: rgba(255,255,255,.96); border: 1px solid var(--rule-strong); padding: 6px 10px; font-size: 12px; max-width: 200px; max-height: calc(100% - 20px); overflow: auto; }
  .layerbox .ttl { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
  .layerbox.closed .body { display: none; }
  .layerbox label { display: flex; align-items: center; gap: 5px; padding: 2px 0; cursor: pointer; }
  .layerbox input[type=range] { width: 100%; }
  .layerbox .sw { display: inline-block; width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; }
  .layerbox .keys { margin: 4px 0; line-height: 1.5; column-count: 2; column-gap: 6px; font-size: 11px; }
  .ringlabel { color: #a3402a; font: 600 11px/1 var(--font); background: rgba(255,255,255,.85); padding: 1px 3px; white-space: nowrap; }
  #circleMsg { font-size: 12px; color: var(--ink-2); padding-bottom: 6px; }
  #map.picking { cursor: crosshair; }
  #map.picking .leaflet-interactive { cursor: crosshair; }
  .chip { font-size: 12px; border: 1px solid var(--rule-strong); border-radius: 2px; padding: 2px 4px 2px 8px; background: var(--sheet); display: inline-flex; align-items: center; gap: 4px; }
  .chip button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .chip button:hover { color: var(--alert); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: end; }
  .filters select { width: auto; max-width: 170px; font-size: 13px; padding: 5px 8px; }
  .filters .grp { font-size: 11px; color: var(--muted); align-self: center; border-left: 2px solid var(--rule-strong); padding-left: 8px; }
  .filters label[hidden], .filters .grp[hidden] { display: none; }
  .filters label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 12px; padding-bottom: 6px; }
  main.mapmain { position: relative; display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #mapWrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #e8e6e0; }
  #panel { border-left: 1px solid var(--rule-strong); overflow-y: auto; padding: 14px 20px 40px; background: var(--paper); }
  .legend { position: absolute; left: 12px; bottom: 22px; z-index: 900; background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px; padding: 8px 10px; font-size: 11px; max-width: 230px; cursor: pointer; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend i { width: 18px; height: 11px; display: inline-block; border: 1px solid rgba(0,0,0,.08); }
  .legend i.few { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(0,0,0,.3) 3px 4px); }
  .legend i.mine { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; }
  .loading { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 950; background: var(--paper);
    border: 1px solid var(--rule-strong); padding: 4px 12px; font-size: 12px; }
  .loading[hidden] { display: none; }
  #panel .tabs { margin: 0 0 10px; }
  #panel .tabs .seg button { min-height: 34px; }
  #panel h2 { font-size: 20px; margin: 10px 0 2px; padding: 0; border: 0; display: block; }
  #panel h3 { font-size: 13px; margin: 22px 0 6px; color: var(--ink); border-bottom: 1px solid var(--rule-strong); padding-bottom: 4px; }
  #panel .figures { margin-top: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #panel .figure { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); }
  #panel .figure:nth-child(odd) { border-right: 1px solid var(--rule); }
  #panel .figure:nth-child(even) { padding-left: 12px; border-right: 0; }
  #panel .figure .v { font-size: 21px; }
  .alt { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .warnline { font-size: 12.5px; color: var(--alert); margin: 10px 0; }
  #panel table { font-size: 12.5px; }
  #panel td, #panel th { padding: 5px 6px 5px 0; white-space: nowrap; }
  #panel td.wrap, #panel th.wrap { white-space: normal; text-align: left; }
  td.bar { width: 26%; }
  .barw { height: 6px; background: var(--rule); }
  .barw span { display: block; height: 100%; background: #3987e5; }
  tr.few td { color: var(--muted); }
  .up { color: var(--alert); } .down { color: var(--accent); }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .minemark { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); padding: 0 3px; margin-left: 4px; border-radius: 2px; }
  #townList tbody tr { cursor: pointer; }
  #townList tbody tr:hover td { background: var(--accent-weak); }
  details.explain { margin: 14px 0; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 8px; }
  details.explain summary { cursor: pointer; color: var(--accent); }
  footer.src { font-size: 11px; color: var(--muted); margin-top: 26px; line-height: 1.7; border-top: 1px solid var(--rule); padding-top: 10px; }
  /* 目安の計算・自分の記録の入力 */
  #panel .formrows .fr { grid-template-columns: 7.5em minmax(0, 1fr); padding: 8px 0; }
  #panel .formrows .fr > * { min-width: 0; }
  #panel .formrows .fr > :not(.lab) { grid-column: 2; }   /* 入力が2行以上でも右の列にそろえる */
  @media (max-width: 640px) { #panel .formrows .fr { grid-template-columns: minmax(0, 1fr); } #panel .formrows .fr > :not(.lab) { grid-column: 1; } }
  #panel .formrows .fr > .lab { font-size: 13px; }
  #panel .formrows input[type=number], #panel .formrows input[type=text], #panel .formrows input[type=month] { width: 6.5em; font-size: 13px; padding: 4px 6px; }
  #panel .formrows input.wide, #panel .formrows select.wide { width: 100%; }
  #panel .formrows select { font-size: 13px; padding: 4px 6px; width: auto; max-width: 100%; }
  .iline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12.5px; color: var(--ink-2); }
  .iline input[type=checkbox] { margin: 0; }
  table.steps td.num, table.steps th.num, table.mine td.num { text-align: right; padding-left: 8px; }
  table.steps tr.total td { font-weight: 600; }
  table.mine td { vertical-align: top; }
  table.mine .del { font: inherit; font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; padding: 1px 6px; }
  /* 土地の形の部品（共通/katachi_ui.js）を入れる欄：横いっぱいに使う */
  #panel .formrows .fr.ktfr { grid-template-columns: minmax(0, 1fr); }
  #panel .formrows .fr.ktfr > * { grid-column: 1; }
  #panel .ktfr details.more { font-size: 13px; color: var(--ink); }
  #panel .ktfr .kt input[type=number] { width: 100%; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  .leaflet-tooltip { font-family: var(--font); font-size: 12px; border-radius: 2px; }
  .leaflet-control-zoom a { border-radius: 2px !important; }
  @media (max-width: 760px) {
    #toggleFilters { display: inline-block; }
    .filters { display: none; }
    .filters.open { display: flex; }
    .filters label { flex: 1 1 45%; }
    .filters select, .areapick select { width: 100%; max-width: none; }
    .areapick label:not(.inline) { flex: 1 1 45%; }
    #app { height: auto; min-height: 100%; }
    main.mapmain { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
    #panel { border-left: 0; border-top: 1px solid var(--rule-strong); padding: 14px 16px 30px; }
    .legend { bottom: 8px; left: 8px; font-size: 10px; padding: 6px 8px; max-width: 180px; }
    .legend.small .row { display: none; }
    .legend.small::after { content: "（押すと色の説明）"; display: block; color: var(--muted); }
  }
</style>
</head>
<body>
<div id="app">
  <nav class="toolnav" data-current="map"></nav>
  <header class="bar">
    <div class="title">
      <h1>相場マップ（売買・賃貸）</h1>
      <span class="sub" id="subTitle"></span>
      <button id="toggleFilters" class="btn" aria-expanded="false">条件をしぼる ▾</button>
    </div>
    <div class="areapick">
      <label>都県 <select id="fPref"></select></label>
      <label>市区町村 <select id="fCity"></select></label>
      <label class="inline"><input type="checkbox" id="fKeep"> いま出ている所も残す（並べて比べる）</label>
      <span class="chips" id="cityChips"></span>
    </div>
    <div class="circlepick">
      <div class="kmgroup">半径で見る（いくつでも選べます）
        <span class="kmchips" id="fKms"><label><input type="checkbox" value="0.5">500m</label><label><input type="checkbox" value="1">1km</label><label><input type="checkbox" value="1.5">1.5km</label><label><input type="checkbox" value="2">2km</label><label><input type="checkbox" value="3">3km</label><label><input type="checkbox" value="5">5km</label><label><input type="checkbox" value="10">10km</label></span>
      </div>
      <label>中心の住所<input type="search" id="fAddr" placeholder="例：渋谷区神南1丁目" autocomplete="off"></label>
      <button class="btn" id="fAddrGo" type="button">探す</button>
      <button class="btn" id="fPick" type="button">地図を押して決める</button>
      <span id="circleMsg"></span>
    </div>
    <div class="circlepick">
      <label>駅の数で見る（駅名）<input type="search" id="fStnName" list="fStnList" placeholder="例：渋谷" autocomplete="off"><datalist id="fStnList"></datalist></label>
      <label>範囲
        <select id="fStnN"><option value="">使わない</option><option value="1">1駅先まで</option><option value="2">2駅先まで</option><option value="3">3駅先まで</option><option value="5">5駅先まで</option><option value="10">10駅先まで</option></select>
      </label>
      <span id="stnMsg" class="muted small"></span>
    </div>
    <div class="filters" id="filters">
      <label>種類
        <span class="seg" id="segType">
          <button data-v="中古マンション等" class="on">マンション</button><button data-v="宅地(土地と建物)">戸建</button><button data-v="宅地(土地)">土地</button><button data-v="宅地(土地と建物・戸建以外)">アパート・店舗等</button>
        </span>
      </label>
      <label>大きく出す単位
        <span class="seg" id="segUnit"><button data-v="m2" class="on">㎡</button><button data-v="tsubo">坪</button></span>
      </label>
      <label>地図の色
        <select id="fColor">
          <option value="price">相場（単価・総額）</option>
          <option value="liq">流動性</option>
          <option value="count">件数</option>
        </select>
      </label>
      <label>データの種類
        <select id="fSrc">
          <option value="all">両方</option>
          <option value="成約">成約価格（レインズ由来）</option>
          <option value="取引">取引価格（アンケート）</option>
        </select>
      </label>
      <label>期間 <select id="fYear"></select></label>
      <label>駅 <select id="fStation"></select></label>
      <label>駅から徒歩
        <select id="fWalk">
          <option value="">すべて</option><option value="0-5">5分以内</option><option value="6-10">6〜10分</option>
          <option value="11-15">11〜15分</option><option value="16-999">16分以上</option>
        </select>
      </label>
      <label>広さ <select id="fArea"></select></label>
      <label data-for="mansion">間取り
        <select id="fPlan">
          <option value="">すべて</option><option value="1R1K">1R・1K・1DK</option><option value="1LDK">1LDK・2K・2DK</option>
          <option value="2LDK">2LDK</option><option value="3LDK">3LDK</option><option value="4LDK">4LDK以上</option>
        </select>
      </label>
      <label data-for="mansion house other">構造
        <select id="fStruct">
          <option value="">すべて</option><option value="RC">RC（鉄筋コンクリート）</option><option value="SRC">SRC（鉄骨鉄筋コンクリート）</option>
          <option value="S">鉄骨（軽量含む）</option><option value="木造">木造</option>
        </select>
      </label>
      <label data-for="mansion house other">築年数
        <select id="fAge">
          <option value="">すべて</option><option value="0-10">10年以内</option><option value="11-20">11〜20年</option>
          <option value="21-30">21〜30年</option><option value="31-40">31〜40年</option><option value="41-999">41年以上</option>
        </select>
      </label>
      <label data-for="house">建物
        <select id="fHouse">
          <option value="">すべて</option><option value="old">古家付きの可能性（木造・築35年以上）</option><option value="notold">古家以外</option>
        </select>
      </label>
      <span class="grp" data-for="house land other">土地の条件</span>
      <label data-for="house land other">土地の形
        <select id="fShape">
          <option value="">すべて</option><option value="seikei">整形（長方形・正方形など）</option>
          <option value="fusei">不整形・台形</option><option value="fukuro">袋地等（旗竿をふくむ）</option>
        </select>
      </label>
      <label data-for="house land other">前面道路
        <select id="fRoad">
          <option value="">すべて</option><option value="public">公道（区道・市道・都道など）</option><option value="private">私道</option>
          <option value="none">道路に接していない</option>
        </select>
      </label>
      <label data-for="house land other">道路の幅
        <select id="fWidth">
          <option value="">すべて</option><option value="lt4">4m未満</option><option value="4to6">4〜6m</option><option value="ge6">6m以上</option>
        </select>
      </label>
      <label data-for="house land other">間口（道路に接する長さ）
        <select id="fFront">
          <option value="">すべて</option><option value="lt2">2m未満（旗竿のおそれ）</option><option value="2to4">2〜4m</option><option value="ge4">4m以上</option>
        </select>
      </label>
      <label>都市計画
        <select id="fCp">
          <option value="noChosei">市街化調整区域を除く</option>
          <option value="">すべて</option>
          <option value="chosei">市街化調整区域だけ</option>
          <option value="low">低層住居</option>
          <option value="mid">中高層住居</option>
          <option value="res">住居</option>
          <option value="com">商業</option>
          <option value="ind">工業</option>
          <option value="other">非線引き・都市計画区域外など</option>
        </select>
      </label>
      <label>取引の事情
        <select id="fJijo">
          <option value="">すべて</option>
          <option value="nospecial">競売・関係者間・隣地などを除く</option>
          <option value="clean">上に加えて私道ふくみも除く</option>
          <option value="private">私道を含む取引だけ</option>
        </select>
      </label>
      <label class="inline"><input type="checkbox" id="fMine"> 自分の記録を地図に出す</label>
    </div>
  </header>
  <main class="mapmain">
    <div id="mapWrap">
      <div id="map" role="application" aria-label="町ごとの相場の地図"></div>
      <div class="legend" id="legend" title="押すと小さくなります"></div>
      <div class="layerbox" id="layerBox">
        <button type="button" class="ttl" id="layerTtl">地図に重ねる ▾</button>
        <div class="body">
          <label><input type="checkbox" id="lyTown"> 町の相場の色</label>
          <label><input type="checkbox" id="lyCircle"> 半径の円</label>
          <label><input type="checkbox" id="lyStn"> 駅（駅数で見るとき）</label>
          <label><input type="checkbox" id="lyZone"> 用途地域</label>
          <label><input type="checkbox" id="lyChosei"> 市街化調整区域</label>
          <label style="display:block">濃さ<input type="range" id="lyAlpha" min="0.15" max="0.8" step="0.05"></label>
          <div class="keys" id="layerKeys"></div>
          <div class="muted small" id="layerMsg"></div>
        </div>
      </div>
      <div class="loading" id="loading" hidden>読みこみ中…</div>
    </div>
    <aside id="panel"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/index.js"></script>
<script src="../../共通/hosei_data.js"></script>
<script src="souba_calc.js"></script>
<script src="../../共通/common.js?v=192f0179"></script>
<script src="../../共通/katachi.js"></script>
<script src="../../共通/katachi_ui.js"></script>
<script>
"use strict";
const C = window.SOUBA_CALC, IDX = window.SOUBA_INDEX;
const TSUBO = C.TSUBO, MIN_N = C.MIN_N;
const RAMP = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#104281"];
const NODATA = "#e9e9e6";
const QUARTERS = IDX.quarters;
const FULL = C.fullYears(QUARTERS);
const Y0 = IDX.from ? IDX.from[0] : 2021, Y1 = IDX.to ? IDX.to[0] : 2026, Q1 = IDX.to ? IDX.to[1] : 4;
const QLABEL = { 1: "1〜3月", 2: "4〜6月", 3: "7〜9月", 4: "10〜12月" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 市区町村の一覧 ----------
const CITY_INFO = {};      // コード → {code, name, pref, n, geo, bbox}
IDX.prefs.forEach(p => p.cities.forEach(([code, name, n, geo, bbox, byType]) => { CITY_INFO[code] = { code, name, pref: p.code, n, geo, bbox, byType: byType || {} }; }));
const DEFAULT_CITIES = ["13110", "13112", "13113"].filter(c => CITY_INFO[c]);

// ---------- 状態 ----------
const S = { type: "中古マンション等", unit: "m2", color: "price", src: "all", year: `${Y0}-${Y1}`,
  station: "", walk: "", area: "", plan: "", struct: "", age: "", house: "", shape: "", road: "", width: "", front: "", jijo: "", cp: "noChosei", lyTown: true, lyCircle: true, lyStn: true, stn: "", stnN: "", lyZone: false, lyChosei: false, lyAlpha: 0.45, kms: [],
  mine: true, keep: false, cities: DEFAULT_CITIES.length ? DEFAULT_CITIES : [], tab: "market", sel: null, km: "", center: null };
try { Object.assign(S, JSON.parse(localStorage.getItem("soubaMap") || "{}"), { sel: null }); } catch (e) {}
S.cities = (S.cities || []).filter(c => CITY_INFO[c]);
if (!S.cities.length) { const first = Object.values(CITY_INFO).find(c => c.n > 0) || Object.values(CITY_INFO)[0]; if (first) S.cities = [first.code]; }
// URLの # のうしろで画面の状態を決められる（例：#c=13113&t=宅地(土地)&k=13113|富ケ谷&tab=calc）。リンクで同じ画面を開くため
let HASH_SEL = null;
try {
  const h = new URLSearchParams(location.hash.slice(1));

    c.towns.forEach(t => { const p = TOWN_CENTER[t.key]; if (!p) return;

// タイルの枠で切る（タイルどうしの重なりで色が濃くならないように）。r は [経度,緯度,…]、返すのは [[緯度,経度],…]
function clipToTile(r, [w, s, e, n]) {
  let pts = []; for (let i = 0; i + 1 < r.length; i += 2) pts.push([r[i], r[i + 1]]);
  const edge = (inside, cross) => { const out = []; pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length];
    if (inside(p)) out.push(p); if (inside(p) !== inside(q)) out.push(cross(p, q)); }); pts = out; };
  const atX = x => (p, q) => [x, p[1] + (q[1] - p[1]) * (x - p[0]) / (q[0] - p[0])], atY = y => (p, q) => [p[0] + (q[0] - p[0]) * (y - p[1]) / (q[1] - p[1]), y];
  edge(p => p[0] >= w, atX(w)); if (pts.length) edge(p => p[0] <= e, atX(e)); if (pts.length) edge(p => p[1] >= s, atY(s)); if (pts.length) edge(p => p[1] <= n, atY(n));

}

    const keys = SURVEY.tilesForBounds(idx.meta.grid, b.getWest(), b.getSouth(), b.getEast(), b.getNorth(), 160);
    if (!keys) { clear(); msg("地図を拡大すると出ます。"); return; }
    msg("読みこみ中…");

    if (seq !== zoneSeq) return;

function colorMetric(t) { return S.color === "price" ? t.med : S.color === "liq" ? t.liq : t.perYear; }

function colorFor(t) {

function baseLand(k) {

    [r => r.k === k && !C.isSpecial(r), "この町の土地（形を問わず・特別な事情なし）"],
    [r => C.shapeGroup(r.shape) === "seikei" && !C.isSpecial(r), cityName(code) + "全体の土地（整形・特別な事情なし）"],
  ];

// 計算の結果の部分（形の部品が変わったときは、ここだけ描きなおす。入力中の欄から指が離れないように）
function calcResultHtml() {
  const p = calcParams();
  if (!p.unitM2 || !p.areaM2) return `<p class="warnline">更地の単価と土地の面積を入れてください。</p>`;
  let h = "";
  const r = C.adjust(p);
  h += `<h3>計算の結果</h3><div class="tablewrap"><table class="steps"><thead><tr><th>段</th><th class="num">低め</th><th class="num">高め</th></tr></thead><tbody>` +
    r.steps.map(s => `<tr><td class="wrap">${s.label}<span class="alt">${esc(s.how)}</span></td><td class="num">${fmtMan(s.lo)}</td><td class="num">${fmtMan(s.hi)}</td></tr>`).join("") +
    `<tr class="total"><td>目安</td><td class="num">${fmtMan(r.lo)}</td><td class="num">${fmtMan(r.hi)}</td></tr></tbody></table></div>`;
  h += `<div class="figures"><div class="figure main"><div class="k">目安の価格</div><div class="v">${fmtMan(r.lo)}〜${fmtMan(r.hi)}</div>
    <div class="s">更地の ${Math.round(r.pctLo * 100)}〜${Math.round(r.pctHi * 100)}%</div></div>
    <div class="figure"><div class="k">土地の単価にすると</div><div class="v" style="font-size:17px">${man(conv(r.unitLo)).toFixed(1)}〜${man(conv(r.unitHi)).toFixed(1)}万円/${unitLabel()}</div>
      <div class="s">${man(otherConv(r.unitLo)).toFixed(1)}〜${man(otherConv(r.unitHi)).toFixed(1)}万円/${otherLabel()}</div></div></div>`;
  h += `<details class="explain"><summary>この計算の決まり（出典）</summary>
    <ul>
      <li>形：国税庁「不整形地補正率表」「間口狭小補正率表」（財産評価基本通達の付表・平成31年1月分以降用の調整率表）。不整形のときは 不整形地補正率×間口狭小補正率（最小0.60）。旗竿も同じやり方です。<b>相続税の評価の表</b>なので、実際の売買ではもっと下がることがあります。町の画面の「全体で見た差」も見てください。</li>
      <li>がけ地：国税庁「がけ地補正率表」。</li>
      <li>借地権・底地：国税庁 No.4611「借地権の評価」・No.4613「貸宅地の評価」（借地権＝更地×借地権割合、底地＝更地×（1−借地権割合））に、市場の一般的な目安（借地権は${C.DEFAULTS.shakuchi.map(v => Math.round(v * 100)).join("〜")}%、底地は${C.DEFAULTS.sokochi.map(v => Math.round(v * 100)).join("〜")}%）を掛けています。第三者に売る底地は更地の1〜2割になることも多い、と言われます。地主・借地人どうしの売買なら高くなります。</li>
      <li>再建築不可（${C.DEFAULTS.rebuild.map(v => Math.round(v * 100)).join("〜")}%）・ひな壇（擁壁は使える：${C.DEFAULTS.slope.map(v => Math.round(v * 100)).join("〜")}%）・擁壁のやり直し（${C.DEFAULTS.youheki.map(v => Math.round(v * 100)).join("〜")}%）・解体費（木造 ${DEMO_TXT("木造")}／鉄骨 ${DEMO_TXT("S")}／RC ${DEMO_TXT("RC")}、延床1坪あたり）は、公的な基準が無いので一般的な目安です。塀・庭木・残置物・地中の埋設物の撤去は別にかかります。数字は、いくつもの不動産会社・鑑定・買取業者の解説を比べて決めました。</li>
      <li>数字はどれも変えられます。自分の経験や「自分の記録」に合わせて直してください。</li>
    </ul></details>`;
  return h;
}
function condYear() { const e = document.getElementById("fYear"); return e.options[e.selectedIndex].text; }
// ---------- 土地の形（共通/katachi_ui.js）：「目安の計算」の中の開け閉めの欄で使う ----------
// パネルは入力のたびに描きなおすので、部品は1つの入れ物（KT_HOST）に作って、描きなおすたびに差しなおす
let KT_UI = null, KT_HOST = null, KT_RES = null, KT_IGN = null;
function ktMark(k) { return CS.ktUse && !CS.ktMan[k] && CS.shape !== "seikei"; }
function ktBind(P) {
  // 印の付いた欄を手で直したら、その欄は手入力を優先（描きなおしより先に動くよう、先に登録する）
  [["cKage", "kage"], ["cSotei", "kage"], ["cAreaM2", "area"], ["cAreaT", "area"], ["cFront", "front"]].forEach(([id, k]) => {
    const e = document.getElementById(id); if (e) e.addEventListener("change", () => { if (CS.ktUse) CS.ktMan[k] = true; }); });
  const box = document.getElementById("cKtBox"), slot = document.getElementById("cKtSlot");
  if (!box || !slot || !window.KatachiUI || !window.Katachi) return;
  if (!KT_HOST) KT_HOST = document.createElement("div");
  slot.appendChild(KT_HOST);
  box.addEventListener("toggle", () => { CS.ktOpen = box.open; saveCalc(); if (box.open) ktMountS(); });
  if (CS.ktOpen) ktMountS();
  ktOut();
  document.getElementById("cKtOut").addEventListener("click", ev => {
    const b = ev.target.closest ? ev.target.closest("[data-kt]") : null; if (!b) return;
    const a = b.getAttribute("data-kt");
    if (a === "off") CS.ktUse = false;
    else { CS.ktUse = true; CS.ktMan = {}; if (KT_RES) ktApplyS(KT_RES); }
    saveCalc(); const y = P.scrollTop; renderPanel(); P.scrollTop = y;
  });
}
function ktMountS() {
  if (KT_UI || !KT_HOST) return;
  const K = window.Katachi;
  let land = CS.kz ? K.fromQuery(CS.kz) : null;
  if (!land && CS.front > 0 && CS.areaM2 > 0) land = K.makeShape("rect", { W: CS.front, D: Math.round(CS.areaM2 / CS.front * 100) / 100 }, 4);   // 今の面積と間口に近い長方形から始める
  KT_IGN = K.toQuery(land || K.makeShape("rect", { W: 10, D: 20 }, 4));
  KT_UI = window.KatachiUI.mount(KT_HOST, { value: land, onChange: ktChangedS });
}
function ktChangedS(res, ui) {
  KT_UI = ui; KT_RES = res;
  const mine = KT_IGN != null && res.query === KT_IGN; KT_IGN = null;   // 最初に開いたときは、手で入れた欄を書きかえない
  if (res.ok) CS.kz = res.query;
  if (!mine && res.ok) CS.ktUse = true;
  const full = CS.ktUse ? ktApplyS(res) : false;
  saveCalc();
  if (full) { const P = document.getElementById("panel"), y = P.scrollTop; renderPanel(); P.scrollTop = y; }
  else ktRefresh();
}
// 形の値を入れる。戻り値 true＝土地の形の選びが変わった（画面をまるごと描きなおす）
function ktApplyS(res) {
  const v = C.fromKatachi(res); if (!v) return false;
  const was = CS.shape;
  if (!CS.ktMan.kage) { CS.kage = v.kagePct; CS.sotei = v.soteiM2; }
  if (!CS.ktMan.area) CS.areaM2 = v.areaM2;
  if (!CS.ktMan.front) CS.front = v.frontM;
  if (v.flag) CS.shape = "hata"; else if (CS.shape === "hata") CS.shape = "fusei";
  return CS.shape !== was;
}
function ktRefresh() {
  const set = (id, v) => { const e = document.getElementById(id); if (e && document.activeElement !== e) e.value = v; };
  set("cKage", CS.kage == null ? "" : CS.kage); set("cSotei", CS.sotei == null ? "" : CS.sotei);
  set("cAreaM2", CS.areaM2 ? +(+CS.areaM2).toFixed(2) : ""); set("cAreaT", CS.areaM2 ? (CS.areaM2 / TSUBO).toFixed(2) : "");
  set("cFront", CS.front == null ? "" : CS.front);
  [["cMkKage", "kage"], ["cMkArea", "area"], ["cMkFront", "front"]].forEach(([id, k]) => { const e = document.getElementById(id); if (e) e.hidden = !ktMark(k); });
  const r = document.getElementById("cResult"); if (r) r.innerHTML = calcResultHtml();
  ktOut();
}
function ktOut() {
  const o = document.getElementById("cKtOut"); if (!o) return;
  if (!KT_RES) { o.innerHTML = ""; return; }
  const v = C.fromKatachi(KT_RES);
  if (!v) { o.innerHTML = `<p class="note alert">形が正しくないため、欄には入れていません（上の注意を見てください）。</p>`; return; }
  const anyMan = ["kage", "area", "front"].some(k => CS.ktMan[k]);
  o.innerHTML = `<p class="small">形から：かげ地割合 <b>${v.kagePct.toFixed(1)}%</b>（想定整形地 ${(+v.soteiM2).toFixed(2)}㎡）・面積 ${(+v.areaM2).toFixed(2)}㎡・間口 ${v.frontM}m${v.flag ? "（旗竿の竿の幅）" : ""}${CS.ktUse ? "" : "。いまは使っていません"}</p>
    <div class="btnrow">${CS.ktUse ? `<button class="btn" type="button" data-kt="off">形の値を使わない（手入力にもどす）</button>` : `<button class="btn primary" type="button" data-kt="on">形の値を欄に入れる</button>`}${CS.ktUse && anyMan ? `<button class="btn" type="button" data-kt="re">手で直した欄も形の値にもどす</button>` : ""}</div>
    <p class="muted small">国税庁の財産評価基本通達20の決め方の目安です（正面の道路は、図で選び直せます）。</p>`;
}
function bindCalc(P) {
  ktBind(P);
  const v = id => { const e = document.getElementById(id); return e ? e.value : null; };
  const f = id => { const x = parseFloat(v(id)); return isFinite(x) ? x : null; };
  const rerender = () => { saveCalc(); const y = P.scrollTop; renderPanel(); P.scrollTop = y; };
  const on = (id, fn, ev = "change") => { const e = document.getElementById(id); if (e) e.addEventListener(ev, () => { fn(e); rerender(); }); };
  on("cUnitM2", () => { CS.unitM2 = f("cUnitM2") * 1e4; CS.unitAuto = false; });
  on("cUnitT", () => { CS.unitM2 = f("cUnitT") * 1e4 / TSUBO; CS.unitAuto = false; });
  const a = document.getElementById("cAuto"); if (a) a.onclick = () => { CS.unitAuto = true; rerender(); };
  on("cAreaM2", () => { CS.areaM2 = f("cAreaM2"); if (CS.sotei && CS.areaM2) CS.kage = Math.max(0, Math.round((CS.sotei - CS.areaM2) / CS.sotei * 100)); });
  on("cAreaT", () => { CS.areaM2 = f("cAreaT") * TSUBO; });
  on("cShape", e => { CS.shape = e.value; });
  on("cKage", () => { CS.kage = f("cKage") || 0; CS.sotei = null; });
  on("cSotei", () => { CS.sotei = f("cSotei"); if (CS.sotei && CS.areaM2) CS.kage = Math.max(0, Math.round((CS.sotei - CS.areaM2) / CS.sotei * 100)); });
  on("cFront", () => { CS.front = f("cFront"); });
  on("cDistrict", e => { CS.district = e.value; });
  on("cSlope", e => { CS.slope = e.value; CS.slopeLo = CS.slopeHi = null; });
  on("cSlopeLo", () => { CS.slopeLo = f("cSlopeLo"); }); on("cSlopeHi", () => { CS.slopeHi = f("cSlopeHi"); });
  on("cWallLo", () => { CS.wallLo = f("cWallLo"); }); on("cWallHi", () => { CS.wallHi = f("cWallHi"); });
  on("cGake", () => { CS.gake = f("cGake") || 0; }); on("cGakeDir", e => { CS.gakeDir = e.value; });
  on("cRebuild", e => { CS.rebuildNG = e.checked; });
  on("cRebLo", () => { CS.rebuildLo = f("cRebLo"); }); on("cRebHi", () => { CS.rebuildHi = f("cRebHi"); });
  on("cRight", e => { CS.right = e.value; CS.rightLo = CS.rightHi = null; });
  on("cLetter", e => { CS.letter = e.value; });
  on("cRightLo", () => { CS.rightLo = f("cRightLo"); }); on("cRightHi", () => { CS.rightHi = f("cRightHi"); });
  on("cHouse", e => { CS.house = e.checked; });
  on("cHStruct", e => { CS.houseStruct = e.value; CS.demoLo = CS.demoHi = null; });
  on("cFloorM2", () => { CS.floorM2 = f("cFloorM2"); }); on("cFloorT", () => { CS.floorM2 = f("cFloorT") * TSUBO; });
  on("cDemoLo", () => { CS.demoLo = f("cDemoLo"); }); on("cDemoHi", () => { CS.demoHi = f("cDemoHi"); });
}

    <div class="fr"><span class="lab">土地の形</span><div class="iline"><select id="mShape">${["", "整形", "不整形", "旗竿"].map(x => `<option value="${x}"${x === MF.shape ? " selected" : ""}>${x || "（わからない）"}</option>`).join("")}</select>
      借地権割合 <select id="mLetter"><option value="">—</option>${Object.keys(C.LEASE).map(x => `<option${x === MF.letter ? " selected" : ""}>${x}</option>`).join("")}</select></div></div>
    <div class="fr"><span class="lab">面積</span><div class="iline"><input type="number" id="mAreaM2" value="${MF.areaM2 ?? ""}" step="any"> ㎡ <input type="number" id="mAreaT" value="${MF.areaM2 ? (MF.areaM2 / TSUBO).toFixed(2) : ""}" step="any"> 坪</div>
      <span class="hint">土地の面積（マンションは専有面積）。</span></div>
    <div class="fr"><span class="lab">延床面積</span><div class="iline"><input type="number" id="mFloor" value="${MF.floorM2 ?? ""}" step="any"> ㎡（建物があるとき）</div></div>
    <div class="fr"><span class="lab">${C.isRentKind(MF.kind) ? "月額賃料" : "価格"}</span><div class="iline"><input type="number" id="mPrice" value="${MF.priceMan ?? ""}" step="any"> 万円${C.isRentKind(MF.kind) ? `　共益費 <input type="number" id="mFee" value="${MF.feeYen ?? ""}" step="any" style="width:6em"> 円/月` : ""}</div></div>
    <div class="fr"><span class="lab">メモ</span><input type="text" id="mMemo" class="wide" value="${esc(MF.memo)}" placeholder="例：旧法借地・地代月2万円・残り12年"></div>
  </div>
  <div class="btnrow"><button class="btn primary" id="mAdd">記録に足す</button><span class="muted small" id="mMsg"></span></div>
  <h3>入れた記録（${MINE.length}件）</h3>`;
  if (MINE.length) {
    h += `<div class="tablewrap"><table class="mine"><thead><tr><th>時期・場所</th><th>種類・条件</th><th class="num">価格／単価</th><th></th></tr></thead><tbody>` +
      [...MINE].sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(r => `<tr><td class="wrap">${esc(r.date)}<br>${esc(r.cityName || cityName(r.city))} ${esc(r.town)}</td>
        <td class="wrap">${esc(mineTags(r))}${r.memo ? `<span class="alt">${esc(r.memo)}</span>` : ""}</td>
        <td class="num">${C.isRentKind(r.kind) ? `${fmtRent(C.rentTotal(r))}/月<span class="alt">${C.rentUnit(r) ? Math.round(C.rentUnit(r)).toLocaleString() + "円/㎡" : ""}</span>` : `${fmtMan(r.price)}<span class="alt">${C.myUnit(r) ? fmtUnit(C.myUnit(r)) : ""}</span>`}</td>
        <td><button class="del" data-id="${esc(r.id)}">消す</button></td></tr>`).join("") + `</tbody></table></div>`;
  } else h += `<p class="muted">まだありません。</p>`;
  h += `<div class="btnrow"><button class="btn" id="mExport"${MINE.length ? "" : " disabled"}>CSVに書き出す</button>
    <span class="btn filebtn">CSVを読みこむ<input type="file" id="mImport" accept=".csv,text/csv"></span></div>
    <p class="muted small">読みこみは「足す」だけです（同じIDの行は上書き）。CSVの列：${C.MY_COLS.map(c => c[1]).join("・")}。Excelで作ってもかまいません。</p>`;
  return h;
}
function bindMine(P) {
  const g = id => document.getElementById(id);
  const keep = () => { MF.date = g("mDate").value; if (g("mTown").value.trim() !== MF.town) MF.userCity = true; MF.town = g("mTown").value.trim(); MF.kind = g("mKind").value; MF.rebuildNG = g("mRebuild").checked;
    MF.slope = g("mSlope").checked; MF.shape = g("mShape").value; MF.letter = g("mLetter").value; MF.memo = g("mMemo").value;
    const a = parseFloat(g("mAreaM2").value); MF.areaM2 = isFinite(a) ? a : null; const fl = parseFloat(g("mFloor").value); MF.floorM2 = isFinite(fl) ? fl : null;
    const p = parseFloat(g("mPrice").value); MF.priceMan = isFinite(p) ? p : null;
    const fe = g("mFee") ? parseFloat(g("mFee").value) : NaN; MF.feeYen = isFinite(fe) ? fe : null; };
  g("mKind").onchange = () => { keep(); const y = P.scrollTop; renderPanel(); P.scrollTop = y; };
  g("mAreaM2").oninput = () => { const a = parseFloat(g("mAreaM2").value); g("mAreaT").value = isFinite(a) ? (a / TSUBO).toFixed(2) : ""; };
  g("mAreaT").oninput = () => { const t = parseFloat(g("mAreaT").value); g("mAreaM2").value = isFinite(t) ? +(t * TSUBO).toFixed(2) : ""; };
  g("mCity").onchange = () => { keep(); MF.userCity = true; MF.city = g("mCity").value; MF.town = ""; loadCity(MF.city).catch(() => {}).then(() => { const y = P.scrollTop; renderPanel(); P.scrollTop = y; }); };
  g("mAdd").onclick = () => {
    keep();
    if (!(MF.priceMan > 0)) { g("mMsg").textContent = (C.isRentKind(MF.kind) ? "月額賃料" : "価格") + "を入れてください。"; return; }
    MINE.push({ id: "m" + Date.now().toString(36), date: MF.date, city: MF.city, cityName: cityName(MF.city), town: MF.town, kind: MF.kind,
      rebuildNG: MF.rebuildNG, slope: MF.slope, shape: MF.shape, area: MF.areaM2, floor: MF.floorM2, price: Math.round(MF.priceMan * 1e4), letter: MF.letter, memo: MF.memo, fee: C.isRentKind(MF.kind) ? MF.feeYen : null });
    saveMine(); MF.priceMan = null; MF.feeYen = null; MF.memo = ""; MF.areaM2 = null; MF.floorM2 = null;
    paint(); renderPanel();
  };
  P.querySelectorAll("button.del").forEach(b => b.onclick = () => {
    if (!confirm("この記録を消しますか？（元にもどせません。先にCSVに書き出しておくと安心です）")) return;
    MINE = MINE.filter(r => r.id !== b.dataset.id); saveMine(); paint(); renderPanel();
  });
  g("mExport").onclick = () => {
    const blob = new Blob([C.toCSV(MINE)], { type: "text/csv" });
    const a = document.createElement("a"), d = new Date();
    a.href = URL.createObjectURL(blob); a.download = `自分の記録_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  g("mImport").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const list = C.fromCSV(String(rd.result));
        const pos = {}; MINE.forEach((r, i) => { pos[r.id] = i; });
        list.forEach(r => { if (pos[r.id] != null) MINE[pos[r.id]] = r; else MINE.push(r); });
        saveMine(); paint(); renderPanel();
        document.getElementById("mMsg") && (document.getElementById("mMsg").textContent = `${list.length}件を読みこみました。`);
      } catch (err) { alert("読みこめませんでした：" + err.message); }
    };
    rd.readAsText(file);
  };
}

function sources() {
  const from = IDX.from ? `${IDX.from[0]}年${QLABEL[IDX.from[1]]}` : "", to = IDX.to ? `${IDX.to[0]}年${QLABEL[IDX.to[1]]}` : "";
  return `<footer class="src disclaimer">
  ・価格：出典 国土交通省「不動産情報ライブラリ」（https://www.reinfolib.mlit.go.jp/）の取引価格情報・成約価格情報をもとに、この道具で集計・加工して作成（${from}〜${to}分）。<br>
  ・町の形と世帯数：「令和2年国勢調査 小地域（町丁・字等）境界データ」（総務省統計局 e-Stat）。<br>
  ・地図：国土地理院。<br>
  ・戸建＝成約価格の「土地と建物」（サイトの説明で戸建のこと）＋取引価格のうち用途が「住宅」のもの。アパート・店舗・ビルなどは「アパート・店舗等」に分けています。<br>
  ・土地の形・間口は取引価格の情報にだけあり、成約価格にはありません。形や間口でしぼると、取引価格だけの数字になります。<br>
  ・国のデータには借地・底地・再建築不可・高低差（擁壁・ひな壇）・古家付きの区別がありません。「目安の計算」は国税庁の表と一般的な目安による計算です。<br>
  ・補正の表：国税庁「土地及び土地の上に存する権利の評価についての調整率表（平成31年1月分以降用）」、No.4611 借地権の評価、No.4613 貸宅地の評価、路線価図の説明（借地権割合 A〜G）。<br>
  ・成約価格と取引価格に同じ取引が入っている場合があります。件数を見るときは「データの種類」をどちらか一方にするのがおすすめです。<br>
  ・この地図は相場の目安です。実際の価格は物件ごとにちがいます（鑑定評価ではありません）。最後の判断は不動産会社・不動産鑑定士・役所に確かめてください。</footer>`;
}

function select(k, fly) {
  S.sel = k; paint(); renderPanel();
  if (k && fly && TOWN_BOUNDS[k]) map.fitBounds(TOWN_BOUNDS[k], { maxZoom: 15, padding: [30, 30] });
  const P = document.getElementById("panel");
  P.scrollTop = 0;
  if (k && window.innerWidth < 760) P.scrollIntoView({ behavior: "smooth" });   // スマホは下の詳細まで動かす
}

// ---------- 画面の部品 ----------
function fillSelect(id, opts, val) {
  const e = document.getElementById(id);
  e.innerHTML = opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  e.value = opts.some(o => o[0] === val) ? val : opts[0][0];
  return e.value;
}
function yearOptions() {
  const last = Q1 < 4 ? `${Y1}年${Q1 * 3}月` : `${Y1}年`;
  const o = [[`${Y0}-${Y1}`, `全期間（${Y0}〜${last}）`]];
  if (FULL.length) o.push([`${FULL[FULL.length - 1]}-${Y1}`, `直近（${FULL[FULL.length - 1]}〜${last}）`]);
  for (let y = Y1; y >= Y0; y--) o.push([`${y}-${y}`, `${y}年` + (y === Y1 && Q1 < 4 ? `（1〜${Q1 * 3}月）` : "")]);
  return o;
}
function refreshOptions() {
  S.area = fillSelect("fArea", AREA_BINS[S.type], S.area);
  const cnt = {}; ALL.forEach(r => { if (r.type === S.type && r.station) cnt[r.station] = (cnt[r.station] || 0) + 1; });
  const st = Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([s, n]) => [s, `${s}（${n}件）`]);
  S.station = fillSelect("fStation", [["", "すべて"], ...st], S.station);
  S.year = fillSelect("fYear", yearOptions(), S.year);
  // 種類ごとに、使える条件だけを出す
  const kind = kindOf();
  document.querySelectorAll("#filters [data-for]").forEach(e => { e.hidden = !e.dataset.for.split(" ").includes(kind); });
  const used = { plan: ["mansion"], struct: ["mansion", "house", "other"], age: ["mansion", "house", "other"], house: ["house"],
    shape: ["house", "land", "other"], road: ["house", "land", "other"], width: ["house", "land", "other"], front: ["house", "land", "other"] };
  Object.entries(used).forEach(([key, kinds]) => { if (!kinds.includes(kind)) S[key] = ""; });
  [["fPlan", "plan"], ["fStruct", "struct"], ["fAge", "age"], ["fWalk", "walk"], ["fSrc", "src"], ["fColor", "color"], ["fHouse", "house"],
    ["fShape", "shape"], ["fRoad", "road"], ["fWidth", "width"], ["fFront", "front"], ["fCp", "cp"], ["fJijo", "jijo"]].forEach(([id, key]) => { document.getElementById(id).value = S[key]; });
  document.getElementById("fMine").checked = !!S.mine;
  document.getElementById("fKeep").checked = !!S.keep;
  document.querySelectorAll("#segType button").forEach(b => b.classList.toggle("on", b.dataset.v === S.type));
  document.querySelectorAll("#segUnit button").forEach(b => b.classList.toggle("on", b.dataset.v === S.unit));
}
function refreshArea() {
  const prefSel = document.getElementById("fPref"), citySel = document.getElementById("fCity");
  const cur = S.cities[S.cities.length - 1];
  const pref = (CITY_INFO[cur] || {}).pref || IDX.prefs[0].code;
  prefSel.innerHTML = IDX.prefs.map(p => `<option value="${p.code}">${p.name}（${p.cities.filter(c => c[2]).length}/${p.cities.length}）</option>`).join("");
  prefSel.value = prefSel.dataset.v || pref;
  const p = IDX.prefs.find(x => x.code === prefSel.value);
  citySel.innerHTML = `<option value="">— 選ぶ —</option>` + p.cities.map(([c, n, cnt]) => `<option value="${c}">${esc(n)}${cnt ? `（${cnt.toLocaleString()}件）` : "（価格データなし）"}</option>`).join("");
  citySel.value = S.cities.includes(cur) && CITY_INFO[cur].pref === p.code ? cur : "";
  document.getElementById("cityChips").innerHTML = S.cities.map(c => `<span class="chip">${esc(cityName(c))}${S.cities.length > 1 ? `<button data-c="${c}" title="外す" aria-label="${esc(cityName(c))}を外す">×</button>` : ""}</span>`).join("");
  document.querySelectorAll("#cityChips button").forEach(b => b.onclick = () => { S.cities = S.cities.filter(c => c !== b.dataset.c); applyCities(); });
  const per = IDX.from ? `${IDX.from[0]}年${QLABEL[IDX.from[1]]}〜${IDX.to[0]}年${QLABEL[IDX.to[1]]}` : "";
  document.getElementById("subTitle").textContent = `${S.cities.map(cityName).join("・")}／${per}`;
}
function update() { aggregate(); if (S.sel && INSIDE && INSIDE[S.sel] == null) S.sel = null; computeBreaks(); drawCircle(); paint(); renderPanel(); save(); }
let loadSeq = 0;
async function applyCities(fit = true) {
  const my = ++loadSeq;
  const L1 = document.getElementById("loading"); L1.hidden = false;
  try { await Promise.all(S.cities.map(loadCity)); }
  catch (e) { alert("市区町村のデータが読みこめませんでした（" + e.message + "）。scripts/build.py を動かしたか確かめてください。"); S.cities = S.cities.filter(c => CITY[c]); }
  if (my !== loadSeq) return;
  L1.hidden = true;
  S.cities.forEach(code => cityLayer(CITY[code]));
  showLayers();
  if (S.sel && !S.cities.includes(S.sel.split("|")[0])) S.sel = null;
  rebuildRows(); refreshArea(); refreshOptions();
  if (fit) fitCities();
  update();
  if (HASH_SEL && TOWN_BOUNDS[HASH_SEL]) { const k = HASH_SEL; HASH_SEL = null; select(k, true); }
}

document.querySelectorAll("#segType button").forEach(b => b.onclick = () => { S.type = b.dataset.v; refreshOptions(); update(); });
document.querySelectorAll("#segUnit button").forEach(b => b.onclick = () => { S.unit = b.dataset.v; refreshOptions(); update(); });
const bind = (id, key) => document.getElementById(id).onchange = e => { S[key] = e.target.value; update(); };
[["fColor", "color"], ["fSrc", "src"], ["fYear", "year"], ["fStation", "station"], ["fWalk", "walk"], ["fArea", "area"], ["fPlan", "plan"],
  ["fStruct", "struct"], ["fAge", "age"], ["fHouse", "house"], ["fShape", "shape"], ["fRoad", "road"], ["fWidth", "width"], ["fFront", "front"],
  ["fCp", "cp"], ["fJijo", "jijo"]].forEach(([id, key]) => bind(id, key));
document.getElementById("fMine").onchange = e => { S.mine = e.target.checked; save(); paint(); };
// 地図に重ねるものの切りかえ
if (innerWidth < 700) document.getElementById("layerBox").classList.add("closed");
document.getElementById("layerTtl").onclick = () => document.getElementById("layerBox").classList.toggle("closed");
const syncLegend = () => { document.getElementById("legend").style.display = S.lyTown === false ? "none" : ""; };   // 色を消したら凡例もしまう
syncLegend();
[["lyTown", () => { syncLegend(); paint(); }], ["lyCircle", () => drawCircle()], ["lyStn", () => drawStation()], ["lyZone", () => drawZoning()], ["lyChosei", () => drawZoning()]].forEach(([id, fn]) => {
  const e = document.getElementById(id); e.checked = S[id] !== false && !!S[id];
  e.onchange = () => { S[id] = e.checked; save(); fn(); };
});
document.getElementById("lyAlpha").value = S.lyAlpha;
document.getElementById("lyAlpha").onchange = e => { S.lyAlpha = +e.target.value; save(); drawZoning(); };
document.getElementById("fKeep").onchange = e => { S.keep = e.target.checked; save(); };
document.getElementById("fPref").onchange = e => { e.target.dataset.v = e.target.value; refreshArea(); };
document.getElementById("fCity").onchange = e => {
  const c = e.target.value; if (!c) return;
  document.getElementById("fPref").dataset.v = "";
  S.cities = S.keep ? [...S.cities.filter(x => x !== c), c] : [c];
  S.center = null; S.kms = []; syncKm(); circleMsg(""); clearStation();   // 市区町村で選びなおしたら円も駅数もやめる
  applyCities();
};
if (!(S.kms && S.kms.length) && S.km) S.kms = [S.km];
syncKm();
// 駅の数で見る
document.getElementById("fStnName").value = S.stn || "";
document.getElementById("fStnN").value = S.stnN || "";
document.getElementById("fStnName").addEventListener("focus", () => loadStations().catch(() => stnMsg("駅のデータを読めませんでした。")), { once: true });
const stnChange = () => {
  S.stn = document.getElementById("fStnName").value.trim(); S.stnN = document.getElementById("fStnN").value;
  if (!S.stn || !S.stnN) { if (STN) { clearStation(); update(); } return; }
  applyStation().catch(() => stnMsg("駅のデータを読めませんでした。"));
};
document.getElementById("fStnName").addEventListener("change", stnChange);
document.getElementById("fStnN").addEventListener("change", stnChange);
document.getElementById("fKms").onchange = () => { S.kms = [...document.querySelectorAll("#fKms input:checked")].map(i => i.value); syncKm(); if (S.km && !S.center) { circleMsg("中心の住所を入れるか、「地図を押して決める」を押してください。"); return; } applyCircle(); };
document.getElementById("fPick").onclick = e => { PICKING = !PICKING; document.getElementById("map").classList.toggle("picking", PICKING); e.target.classList.toggle("on", PICKING); circleMsg(PICKING ? "地図の中心にしたい場所を押してください。" : ""); };
async function searchAddr() {
  const q = document.getElementById("fAddr").value.trim(); if (!q) return;
  circleMsg("探しています…");
  try {
    const res = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q)), list = await res.json();
    if (!list || !list.length) { circleMsg("見つかりませんでした。市区町村の名前から入れてみてください。"); return; }
    const [lng, lat] = list[0].geometry.coordinates;
    circleMsg(list[0].properties.title + " を中心にしました。");
    S.center = [lat, lng]; if (!S.km) { S.kms = ["1"]; syncKm(); }
    const m = document.getElementById("circleMsg").textContent;
    applyCircle(); if (S.center) circleMsg(m);
  } catch (err) { circleMsg("住所を探せませんでした（国土地理院の住所検索につながりません）。地図を押して決めてください。"); }
}
document.getElementById("fAddrGo").onclick = searchAddr;
document.getElementById("fAddr").addEventListener("keydown", e => { if (e.key === "Enter") searchAddr(); });
document.getElementById("toggleFilters").onclick = e => {
  const f = document.getElementById("filters"), open = f.classList.toggle("open");
  e.target.setAttribute("aria-expanded", open); e.target.textContent = open ? "条件を閉じる ▴" : "条件をしぼる ▾";
  setTimeout(() => map.invalidateSize(), 50);
};

refreshArea();
refreshOptions();
requestAnimationFrame(() => { (S.stn && S.stnN ? applyStation() : circleOn() ? applyCircle() : applyCities(true)); drawZoning(); });   // 画面の大きさが決まってから地図を合わせる
</script>
</body>
