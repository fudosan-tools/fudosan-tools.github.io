<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="../../icon-192.png?v=2">
<meta name="apple-mobile-web-app-title" content="不動産ツール">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相場マップ（売買・賃貸）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../../共通/common.css?v=271d7a31">
<style>
  /* 地図のページだけの形（色・文字は共通の決まりを使う） */
  html, body { height: 100%; }
  body { font-size: 14px; }
  #app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }   /* 列を画面の幅までにする（メニューの1行の長さでページが広がらないように） */
  header.bar { padding: 12px 16px 10px; border-bottom: 1px solid var(--rule); background: var(--paper); }
  .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .title h1 { font-size: 20px; margin: 0; }
  .title .sub { color: var(--muted); font-size: 12px; }
  #toggleFilters { margin-left: auto; display: none; }
  .filters:not(.advopen) .adv { display: none !important; }
  #advBtn { align-self: flex-end; font-size: 12.5px; }
  @media print { #advBtn { display: none !important; } }
  .areapick { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: end; }
  .areapick label, .filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-2); gap: 3px; }
  .areapick select { width: auto; max-width: 200px; font-size: 13px; padding: 5px 8px; }
  .areapick label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 12px; padding-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  .circlepick { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; align-items: end; }
  .circlepick label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-2); gap: 3px; }
  .circlepick select, .circlepick input { font-size: 13px; padding: 5px 8px; }
  .circlepick input { width: 15em; max-width: 100%; }
  .circlepick .btn { min-height: 32px; }
  .circlepick .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kmchips { display: flex; flex-wrap: wrap; gap: 4px; }
  .kmchips label { flex-direction: row; align-items: center; gap: 3px; font-size: 13px; color: var(--ink); border: 1px solid var(--rule-strong); padding: 4px 8px; background: #fff; cursor: pointer; }
  .kmchips label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kmchips input { width: auto; padding: 0; margin: 0; }
  .kmgroup { font-size: 11px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
  .layerbox { position: absolute; top: 10px; right: 10px; z-index: 900; background: rgba(255,255,255,.96); border: 1px solid var(--rule-strong); padding: 6px 10px; font-size: 12px; max-width: 200px; max-height: calc(100% - 20px); overflow: auto; }
  .layerbox .ttl { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; }
  .layerbox.closed .body { display: none; }
  .layerbox label { display: flex; align-items: center; gap: 5px; padding: 2px 0; cursor: pointer; }
  .layerbox input[type=range] { width: 100%; }
  .layerbox .sw { display: inline-block; width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; }
  .layerbox .keys { margin: 4px 0; line-height: 1.5; column-count: 2; column-gap: 6px; font-size: 11px; }
  .ringlabel { color: #a3402a; font: 600 11px/1 var(--font); background: rgba(255,255,255,.85); padding: 1px 3px; white-space: nowrap; }
  #circleMsg { font-size: 12px; color: var(--ink-2); padding-bottom: 6px; }
  #map.picking { cursor: crosshair; }
  #map.picking .leaflet-interactive { cursor: crosshair; }
  .chip { font-size: 12px; border: 1px solid var(--rule-strong); border-radius: 2px; padding: 2px 4px 2px 8px; background: var(--sheet); display: inline-flex; align-items: center; gap: 4px; }
  .chip button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .chip button:hover { color: var(--alert); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; align-items: end; }
  .filters select { width: auto; max-width: 170px; font-size: 13px; padding: 5px 8px; }
  .filters .grp { font-size: 11px; color: var(--muted); align-self: center; border-left: 2px solid var(--rule-strong); padding-left: 8px; }
  .filters label[hidden], .filters .grp[hidden] { display: none; }
  .filters label.inline { flex-direction: row; align-items: center; gap: 6px; font-size: 12px; padding-bottom: 6px; }
  main.mapmain { position: relative; display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
  #mapWrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; background: #e8e6e0; }
  #panel { border-left: 1px solid var(--rule-strong); overflow-y: auto; padding: 14px 20px 40px; background: var(--paper); }
  .legend { position: absolute; left: 12px; bottom: 22px; z-index: 900; background: var(--paper); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: 2px; padding: 8px 10px; font-size: 11px; max-width: 230px; cursor: pointer; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend i { width: 18px; height: 11px; display: inline-block; border: 1px solid rgba(0,0,0,.08); }
  .legend i.few { background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(0,0,0,.3) 3px 4px); }
  .legend i.mine { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; }
  .loading { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 950; background: var(--paper);
    border: 1px solid var(--rule-strong); padding: 4px 12px; font-size: 12px; }
  .loading[hidden] { display: none; }
  #panel .tabs { margin: 0 0 10px; }
  #panel .tabs .seg button { min-height: 34px; }
  #panel h2 { font-size: 20px; margin: 10px 0 2px; padding: 0; border: 0; display: block; }
  #panel h3 { font-size: 13px; margin: 22px 0 6px; color: var(--ink); border-bottom: 1px solid var(--rule-strong); padding-bottom: 4px; }
  #panel .figures { margin-top: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #panel .figure { padding: 8px 10px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); }
  #panel .figure:last-child { border-right: 0; }
  #panel .figures > .figure:nth-child(2) { padding-left: 0 !important; }
  #panel .figure.main + .figure:last-child { grid-column: 1 / -1; }
  #panel .figure.main { grid-column: 1 / -1; border-right: 0; padding-left: 0; }
  #panel .figure .v { font-size: 21px; }
  .alt { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .warnline { font-size: 12.5px; color: var(--alert); margin: 10px 0; }
  #panel table { font-size: 12.5px; }
  #panel td, #panel th { padding: 5px 6px 5px 0; white-space: nowrap; }
  #panel td.wrap, #panel th.wrap { white-space: normal; text-align: left; }
  td.bar { width: 26%; }
  .barw { height: 6px; background: var(--rule); }
  .barw span { display: block; height: 100%; background: #3987e5; }
  tr.few td { color: var(--muted); }
  .up { color: var(--alert); } .down { color: var(--accent); }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .minemark { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent); padding: 0 3px; margin-left: 4px; border-radius: 2px; }
  #townList tbody tr { cursor: pointer; }
  #townList tbody tr:hover td { background: var(--accent-weak); }
  details.explain { margin: 14px 0; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 8px; }
  details.explain summary { cursor: pointer; color: var(--accent); }
  details.explain p { margin: 6px 0 0; line-height: 1.7; }
  #panel details.blk > summary { list-style: none; cursor: pointer; position: relative; }
  #panel details.blk > summary::-webkit-details-marker { display: none; }
  #panel details.blk > summary h3 { padding-right: 22px; }
  #panel details.blk > summary::after { content: "＋"; position: absolute; right: 2px; bottom: 6px; font-size: 12px; color: var(--accent); }
  #panel details.blk[open] > summary::after { content: "－"; }
  #panel details.blk:not([open]) > summary h3 { color: var(--ink-2); font-weight: 600; }
  #panel details.notes { margin: 6px 0 2px; font-size: 12px; color: var(--ink-2); }
  #panel details.notes > summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  #panel details.notes p { margin: 4px 0; }
  #panel details.srcbox { margin-top: 22px; }
  #panel details.srcbox > summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  #townList td.stars .rk { color: var(--ink-2); letter-spacing: 0; font-size: 11px; }
  #panel table.rank td .of { color: var(--muted); font-size: 11.5px; margin-left: 2px; }
  footer.src { font-size: 11px; color: var(--muted); margin-top: 26px; line-height: 1.7; border-top: 1px solid var(--rule); padding-top: 10px; }
  /* 目安の計算・登録した成約例の入力 */
  #panel .formrows .fr { grid-template-columns: 7.5em minmax(0, 1fr); padding: 8px 0; }
  #panel .formrows .fr > * { min-width: 0; }
  #panel .formrows .fr > :not(.lab) { grid-column: 2; }   /* 入力が2行以上でも右の列にそろえる */
  @media (max-width: 640px) { #panel .formrows .fr { grid-template-columns: minmax(0, 1fr); } #panel .formrows .fr > :not(.lab) { grid-column: 1; } }
  #panel .formrows .fr > .lab { font-size: 13px; }
  #panel .formrows input[type=number], #panel .formrows input[type=text], #panel .formrows input[type=month] { width: 6.5em; font-size: 13px; padding: 4px 6px; }
  #panel .formrows input.wide, #panel .formrows select.wide { width: 100%; }
  #panel .formrows select { font-size: 13px; padding: 4px 6px; width: auto; max-width: 100%; }
  .iline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12.5px; color: var(--ink-2); }
  .iline input[type=checkbox] { margin: 0; }
  table.steps td.num, table.steps th.num, table.mine td.num { text-align: right; padding-left: 8px; }
  table.steps tr.total td { font-weight: 600; }
  table.mine td { vertical-align: top; }
  table.mine .del { font: inherit; font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; padding: 1px 6px; }
  /* 土地の形の部品（共通/katachi_ui.js）を入れる欄：横いっぱいに使う */
  #panel .formrows .fr.ktfr { grid-template-columns: minmax(0, 1fr); }
  #panel .formrows .fr.ktfr > * { grid-column: 1; }
  #panel .ktfr details.more { font-size: 13px; color: var(--ink); }
  #panel .ktfr .kt input[type=number] { width: 100%; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  .unitline { font-size: 10.5px; color: var(--ink-2); margin: 1px 0 3px; }
  .unitnote { font-size: 12px; color: var(--ink-2); background: var(--sheet); border-left: 3px solid var(--accent); padding: 5px 8px; margin: 8px 0; }
  #printBtn { margin-left: auto; }
  #printBtn + #toggleFilters { margin-left: 0; }
  #printHead, #printFoot { display: none; }
  /* 種類の札：土地だけ＝こい青、中古戸建＝水色、古家付き＝茶色（色だけでなく文字でも分ける） */
  .typebadge { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 6px 0 8px; padding: 6px 10px; border-left: 6px solid #104281; background: #eef3fb; }
  .typebadge b { font-size: 15px; color: #0b2f5e; }
  .typebadge span { font-size: 12px; color: var(--ink-2); }
  .typebadge.house { border-left-color: #6da7ec; background: #f1f7fe; }
  .typebadge.mansion, .typebadge.apart { border-left-color: #77736b; background: #f4f3f0; }
  .typebadge.mansion b, .typebadge.apart b { color: var(--ink); }
  .lhbars { margin: 10px 0 12px; }
  .lhrow { margin: 8px 0; }
  .lhlab { font-size: 12px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
  .lhlab span { color: var(--muted); white-space: nowrap; }
  .lhbar { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .lhbar i { display: block; height: 14px; border-radius: 0 3px 3px 0; background: #104281; }
  .lhbar b { font-size: 13px; white-space: nowrap; }
  .lhrow.old .lhbar i { background: #b0722a; }
  .lhrow.used .lhbar i { background: #3987e5; }
  .lhrow.new .lhbar i { background: #9ec5f4; }
  .lhrow.few .lhbar i { opacity: .5; }
  .lhcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
  .lhcard { border: 1px solid var(--rule-strong); border-top: 5px solid #104281; padding: 7px 8px; background: #fff; min-width: 0; }
  .lhcard.old { border-top-color: #b0722a; }
  .lhcard.used { border-top-color: #3987e5; }
  .lhcard.new { border-top-color: #9ec5f4; }
  .lhcard.mansion { border-top-color: #77736b; }
  .lhrow.mansion .lhbar i { background: #77736b; }
  .lhhead { margin: 12px 0 2px; font-size: 13px; font-weight: 600; }
  .lhcard .t { font-size: 12px; font-weight: 600; }
  .lhcard .v { font-size: 17px; font-weight: 600; margin: 3px 0; }
  .lhcard .v small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
  .lhcard .s { font-size: 11px; color: var(--ink-2); }
  @media (max-width: 380px) { .lhcards { grid-template-columns: minmax(0, 1fr); } }
  table.kv td:last-child { text-align: right; }
  table.kv.zoning td:first-child { width: 7.5em; color: var(--ink-2); }
  table.kv.zoning td:last-child { text-align: left; }
  table.kv.rank td:first-child { white-space: normal; }
  #panel thead th { white-space: normal; }   /* 見出しが長くても横にはみ出さないように折り返す */
  #panel table.kv td:first-child { white-space: normal; }
  /* 家賃：建て方ごとの表。見出しの左の色帯と文字で、どの表か分かるように */
  h3.renttype { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 5px 10px; border-left: 6px solid #6da7ec; background: #f1f7fe; font-size: 15px; }
  h3.renttype span { font-size: 12px; font-weight: 400; color: var(--ink-2); }
  h3.renttype.apart { border-left-color: #b0722a; background: #faf3ea; }
  h3.renttype.mansion { border-left-color: #77736b; background: #f4f3f0; }
  h3.renttype.est { border-left-color: #104281; background: #eef3fb; }
  table.rent { width: 100%; }
  table.rent td, table.rent th { padding-right: 8px !important; vertical-align: top; }
  table.rent tr.few td { color: var(--muted); }
  table.rent th.num { text-align: right; }
  table.rent td.rng { width: 38%; font-size: 12px; white-space: nowrap; text-align: left; }
  table.rent th { white-space: nowrap !important; }
  #panel table.rent th.rng { text-align: left; }
  table.rent th .alt { display: block; font-weight: 400; }
  table.rent td.est b { font-size: 15px; color: #0b2f5e; }
  table.rent th.est { color: #0b2f5e; }
  table.kv.rentf td:first-child { white-space: normal; }
  table.kv.rentf th .alt { display: block; font-weight: 400; font-size: 10.5px; }
  table.kv.rentf th { vertical-align: bottom; }
  .rbar { position: relative; height: 8px; margin-top: 3px; background: #edece8; border-radius: 4px; }
  .rbar i { position: absolute; top: 0; height: 8px; border-radius: 4px; background: #6da7ec; }
  .rbar b { position: absolute; top: -2px; width: 2px; height: 12px; margin-left: -1px; background: #0b2f5e; }
  table.rent.apart .rbar i { background: #d9a86a; }
  table.rent.mansion .rbar i { background: #a9a59c; }
  table.rent tr.few .rbar i { opacity: .45; }
  /* スマホで入力欄を押したとき、文字が16pxより小さいと画面が勝手に拡大されるので、指で操作する端末では16pxにする */
  @media (pointer: coarse), (max-width: 760px) { input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea { font-size: 16px !important; } }
  @media (max-width: 640px) { table.rent { font-size: 12px !important; } table.rent td, table.rent th { padding-right: 4px !important; } table.rent .alt { font-size: 10px; } table.rent th { font-size: 10.5px; } table.rent td.rng { font-size: 11px; white-space: normal; } }
  .explain h3 { margin-top: 18px !important; }
  /* PDF（印刷）：地図をA4の幅にそろえる。画面でも同じ大きさにしてから印刷するので、地図の絵がずれない */
  body.printing #mapWrap { width: 190mm; height: 120mm; }
  @page { size: A4 portrait; margin: 10mm; }
  @media print {
    html, body { height: auto; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #app { display: block; height: auto; }
    header.bar, .layerbox, .leaflet-control-zoom, .loading, #panel .tabs, #panel .btn, #panel .btnrow, #back { display: none !important; }
    #printHead { display: block; margin: 0 0 3mm; font-size: 10pt; line-height: 1.6; }
    #printHead h1 { font-size: 15pt; margin: 0 0 1mm; }
    #printHead p { margin: 0; color: #333; }
    #printFoot { display: block; margin-top: 6mm; padding-top: 2mm; border-top: 1px solid #999; font-size: 9pt; color: #333; break-inside: avoid; }
    #panel .typebadge { display: none; }   /* PDFでは頭に1回だけ出す */
    #panel .lhbars, #panel .lhcards, .typebadge, h3.renttype, .rbar, .rbar i, .rbar b { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #panel section.blk.split, #panel details.blk.split { break-inside: auto !important; page-break-inside: auto !important; }
    #panel details > summary::after, #panel details.notes > summary, #panel details.explain > summary, #panel details.srcbox > summary { display: none !important; }
    #panel .lhpart, #panel .lhcard { break-inside: avoid; page-break-inside: avoid; }
    #panel section.blk.split > h3 { break-after: avoid; page-break-after: avoid; }
    #panel .blk, #panel .figures, #panel table.kv, #panel .unitnote, #panel .explain, #panel footer.src { break-inside: avoid; page-break-inside: avoid; }
    #panel h2, #panel h3 { break-after: avoid; page-break-after: avoid; }
    main.mapmain { display: block; }
    #mapWrap { width: 190mm; height: 120mm; border: 1px solid #999; break-inside: avoid; }
    .legend.small .row { display: flex !important; }
    .legend.small::after { content: none !important; }
    #panel { border: 0; overflow: visible; padding: 4mm 0 0; background: #fff; }
    #panel td, #panel th { white-space: normal; }
    #panel tr, #panel .figure, .unitnote { break-inside: avoid; }
    #panel h2, #panel h3 { break-after: avoid; }
  }
  .leaflet-tooltip { font-family: var(--font); font-size: 12px; border-radius: 2px; }
  .leaflet-control-zoom a { border-radius: 2px !important; }
  @media (max-width: 760px) {
    #toggleFilters { display: inline-block; }
    .filters { display: none; }
    .filters.open { display: flex; }
    .filters label { flex: 1 1 45%; }
    .filters select, .areapick select { width: 100%; max-width: none; }
    .areapick label:not(.inline) { flex: 1 1 45%; }
    #app { height: auto; min-height: 100%; }
    main.mapmain { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58vh auto; }
    #panel { border-left: 0; border-top: 1px solid var(--rule-strong); padding: 14px 16px 30px; }
    .legend { bottom: 8px; left: 8px; font-size: 10px; padding: 6px 8px; max-width: 180px; }
    .legend.small .row { display: none; }
    .legend.small::after { content: "（クリックで凡例を表示）"; display: block; color: var(--muted); }
  }
</style>
</head>
<body>
<div id="app">
  <nav class="toolnav" data-current="map"></nav>
  <header class="bar">
    <div class="title">
      <h1>相場マップ（売買・賃貸）</h1>
      <span class="sub" id="subTitle"></span>
      <button id="printBtn" class="btn primary" type="button" title="表示中の地図と相場情報を、A4サイズのPDFとして保存します">PDFで保存</button>
      <button id="toggleFilters" class="btn" aria-expanded="false">条件を絞り込む ▾</button>
    </div>
    <div class="areapick">
      <label>都道府県 <select id="fPref"></select></label>
      <label>市区町村 <select id="fCity"></select></label>
      <label class="inline"><input type="checkbox" id="fKeep"> 表示中の地域を残して追加（比較用）</label>
      <span class="chips" id="cityChips"></span>
    </div>
    <div class="circlepick">
      <div class="kmgroup">半径で表示（複数選択可）
        <span class="kmchips" id="fKms"><label><input type="checkbox" value="0.5">500m</label><label><input type="checkbox" value="1">1km</label><label><input type="checkbox" value="1.5">1.5km</label><label><input type="checkbox" value="2">2km</label><label><input type="checkbox" value="3">3km</label><label><input type="checkbox" value="5">5km</label><label><input type="checkbox" value="10">10km</label></span>
      </div>
      <label>中心地点の住所<input type="search" id="fAddr" placeholder="例：渋谷区神南1丁目" autocomplete="off"></label>

<script>
"use strict";
const C = window.SOUBA_CALC, IDX = window.SOUBA_INDEX;
const TSUBO = C.TSUBO, MIN_N = C.MIN_N;
const RAMP = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#104281"];
const NODATA = "#e9e9e6";
const QUARTERS = IDX.quarters;
const FULL = C.fullYears(QUARTERS);
const Y0 = IDX.from ? IDX.from[0] : 2021, Y1 = IDX.to ? IDX.to[0] : 2026, Q1 = IDX.to ? IDX.to[1] : 4;
const QLABEL = { 1: "1〜3月", 2: "4〜6月", 3: "7〜9月", 4: "10〜12月" };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- 市区町村の一覧 ----------
const CITY_INFO = {};      // コード → {code, name, pref, n, geo, bbox}
IDX.prefs.forEach(p => p.cities.forEach(([code, name, n, geo, bbox, byType]) => { CITY_INFO[code] = { code, name, pref: p.code, n, geo, bbox, byType: byType || {} }; }));
const DEFAULT_CITIES = ["13110", "13112", "13113"].filter(c => CITY_INFO[c]);

// ---------- 状態 ----------
const S = { type: "中古マンション等", unit: "m2", color: "price", src: "all", year: `${Y0}-${Y1}`,
  station: "", walk: "", area: "", plan: "", struct: "", age: "", house: "", shape: "", road: "", width: "", front: "", jijo: "", cp: "noChosei", lyTown: true, lyCircle: true, lyStn: true, stn: "", stnN: "", lyZone: false, lyChosei: false, lyAlpha: 0.45, kms: [],
  mine: true, keep: false, cities: DEFAULT_CITIES.length ? DEFAULT_CITIES : [], tab: "market", sel: null, km: "", center: null };
try { Object.assign(S, JSON.parse(localStorage.getItem("soubaMap") || "{}"), { sel: null }); } catch (e) {}
S.cities = (S.cities || []).filter(c => CITY_INFO[c]);
if (!S.cities.length) { const first = Object.values(CITY_INFO).find(c => c.n > 0) || Object.values(CITY_INFO)[0]; if (first) S.cities = [first.code]; }
// URLの # のうしろで画面の状態を決められる（例：#c=13113&t=宅地(土地)&k=13113|富ケ谷&tab=calc）。リンクで同じ画面を開くため
let HASH_SEL = null;
try {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("c")) S.cities = h.get("c").split(",");
  if (h.get("t")) S.type = h.get("t");
  ["tab", "src", "year", "shape", "road", "width", "front", "jijo", "cp", "house", "unit", "color", "area", "struct", "age", "plan", "walk", "station"].forEach(key => { if (h.has(key)) S[key] = h.get(key); });
  HASH_SEL = h.get("k");
  if (h.get("rc")) { const a = h.get("rc").split(",").map(Number); if (a.length === 2 && a.every(isFinite)) S.center = a; }
  if (h.get("rk")) { S.kms = h.get("rk").split(","); S.km = String(Math.max(...S.kms.map(Number))); S.stn = ""; S.stnN = ""; }
  if (h.get("st")) { S.stn = h.get("st"); S.stnN = h.get("sn") || "1"; S.center = null; S.kms = []; S.km = ""; }
} catch (e) {}
S.tab = "market"; S.mine = false;   // タブと成約例の表示は外した
S.cities = S.cities.filter(c => CITY_INFO[c]);
if (!S.cities.length) S.cities = DEFAULT_CITIES.length ? DEFAULT_CITIES : [Object.keys(CITY_INFO)[0]];
if (!C.TYPES[S.type]) S.type = "中古マンション等";
const save = () => { try { const { sel, ...rest } = S; localStorage.setItem("soubaMap", JSON.stringify(rest)); } catch (e) {} };

// ---------- 書式 ----------
const man = v => (v / 10000);
const fmtMan = v => v == null || isNaN(v) ? "—" : (man(v) >= 10000 ? (man(v) / 10000).toFixed(2) + "億円" : Math.round(man(v)).toLocaleString() + "万円");
const unitLabel = () => S.unit === "m2" ? "㎡" : "坪";
const conv = v => S.unit === "m2" ? v : v * TSUBO;
// ㎡と坪はいつも両方出す（選んだ方を大きく、もう一方を小さく）
const otherLabel = () => S.unit === "m2" ? "坪" : "㎡";
const otherConv = v => S.unit === "m2" ? v * TSUBO : v;
const fmtUnit = v => v == null ? "—" : man(conv(v)).toFixed(1) + "万円/" + unitLabel() + "（" + man(otherConv(v)).toFixed(1) + "万円/" + otherLabel() + "）";
const fmtUnitHtml = v => v == null ? "—" : man(conv(v)).toFixed(1) + "万円/" + unitLabel() + `<span class="alt">${man(otherConv(v)).toFixed(1)}万円/${otherLabel()}</span>`;
const fmtArea = a => a == null ? "—" : (S.unit === "m2" ? Math.round(a) + "㎡（" + (a / TSUBO).toFixed(1) + "坪）" : (a / TSUBO).toFixed(1) + "坪（" + Math.round(a) + "㎡）");
const isTotalType = () => C.isTotal(S.type);
const kindOf = () => ({ "中古マンション等": "mansion", "宅地(土地と建物)": "house", "宅地(土地)": "land", "宅地(土地と建物・戸建以外)": "other" })[S.type];
const mainVal = r => C.mainVal(r, S.type);
const fmtMain = v => isTotalType() ? fmtMan(v) : fmtUnitHtml(v);
const perUnit = () => "1" + unitLabel() + "あたり";
const mainName = () => isTotalType() ? "取引価格（土地と建物の合計）の中央値" : (S.type === "宅地(土地)" ? `土地の単価（土地${perUnit()}・中央値）` : `単価（専有面積${perUnit()}・中央値）`);
const colName = (total = isTotalType()) => total ? "取引価格（土地＋建物の合計）" : "単価（" + (S.type === "中古マンション等" ? "専有面積" : "土地") + perUnit() + "）";
// 「主な価格帯」＝安い方から25%〜75%（取引の半分がこの間に入る）
const rangeLabel = () => "主な価格帯（中央50%）";
// 数字の単位の説明（画面の一覧とPDFの頭に出す）
const unitText = () => isTotalType()
  ? "金額：1件あたりの取引価格（土地・建物の合計）"
  : `単位：${S.type === "宅地(土地)" ? "土地" : "専有面積"}1${unitLabel()}あたり万円（小さい文字は1${otherLabel()}あたり）`;
const median = C.median, quant = C.quant, stats = C.stats, tmed = C.tmed;
const townName = k => k.split("|")[1];
const cityName = code => CITY_INFO[code] ? CITY_INFO[code].name : code;
const wardOf = k => cityName(k.split("|")[0]);

// ---------- 市区町村のデータを読みこむ（file:// でも動くよう <script> を足す） ----------
const CITY = {}, PENDING = {};
// 流動性の順位（scripts/build_liq_rank.js で前もって数えたもの）。市区町村のデータといっしょに読む
const LIQR = {};
window.SOUBA_LIQ = { add(o) { LIQR[o.code] = o; if ((S.sel && S.sel.startsWith(o.code + "|")) || S.cities.includes(o.code)) renderPanel(); } };
function loadLiq(code) {
  if (LIQR[code] || document.querySelector(`script[data-liq="${code}"]`)) return;
  const s = document.createElement("script"); s.src = "data/l_" + code + ".js"; s.dataset.liq = code; s.onerror = () => window.SOUBA_LIQ.add({ code, n: [], t: {} }); document.head.appendChild(s);   // 順位の対象になる町が無い市区町村は、ファイルが無いので空で入れる
}
window.SOUBA = { add(o) { const c = C.decodeCity(o); CITY[c.code] = c; if (PENDING[c.code]) { PENDING[c.code](c); delete PENDING[c.code]; } } };
function loadCity(code) {
  if (CITY[code]) return Promise.resolve(CITY[code]);
  loadLiq(code);
  return new Promise((resolve, reject) => {
    PENDING[code] = resolve;
    const s = document.createElement("script");
    s.src = "data/c_" + code + ".js";
    s.onerror = () => { delete PENDING[code]; reject(new Error(code)); };
    document.head.appendChild(s);
  });
}
let ALL = [], HH = {};
function rebuildRows() {
  ALL = []; HH = {};
  S.cities.forEach(code => { const c = CITY[code]; if (!c) return; ALL = ALL.concat(c.rows); c.towns.forEach(t => { HH[t.key] = t.hh; }); });
}

// ---------- 条件のしぼりこみ ----------
const AREA_LAND = [["", "すべて"], ["0-100", "土地100㎡未満（約30坪未満）"], ["100-150", "100〜150㎡（約30〜45坪）"], ["150-200", "150〜200㎡（約45〜60坪）"], ["200-99999", "200㎡以上（約60坪以上）"]];
const AREA_BINS = {
  "中古マンション等": [["", "すべて"], ["0-40", "40㎡未満（約12坪未満）"], ["40-60", "40〜60㎡（約12〜18坪）"], ["60-80", "60〜80㎡（約18〜24坪）"], ["80-9999", "80㎡以上（約24坪以上）"]],
  "宅地(土地と建物)": AREA_LAND, "宅地(土地)": AREA_LAND, "宅地(土地と建物・戸建以外)": AREA_LAND,
};

// ---------- 町ごとの集計 ----------
let TOWN = {}, LIQ = { n: 0 };
function aggregate() {
  computeInside();
  const a = C.aggregate(scopeRows(), S, k => HH[k], QUARTERS); TOWN = a.TOWN; LIQ = a.LIQ;
}
// いま見ている範囲の取引（駅数・半径・全部）
const scopeRows = () => STN ? ALL.filter(r => rowHop(r) != null) : INSIDE ? ALL.filter(r => INSIDE[r.k] != null) : ALL;

// ---------- 駅の数で見る。取引の「最寄駅」で数えるので、町の代表点で数える半径より正確 ----------
const NEAR_KM = 6;    // 同じ名前の遠くの駅と取りちがえないよう、駅から町までの距離で確かめる
let STN = null, STATIONS = null, STN_LABEL = {};
const stnMsg = t => { document.getElementById("stnMsg").textContent = t; };
async function loadStations() {
  if (STATIONS) return STATIONS;
  await loadScript("data/stations.js");
  STATIONS = window.SOUBA_STATIONS;
  const count = {}; STATIONS.h.forEach(h => { count[h[0]] = (count[h[0]] || 0) + 1; });
  STN_LABEL = {}; STATIONS.h.forEach((h, i) => { STN_LABEL[count[h[0]] > 1 ? `${h[0]}（${h[3].split("、")[0]}）` : h[0]] = i; });
  document.getElementById("fStnList").innerHTML = Object.keys(STN_LABEL).map(l => `<option value="${esc(l)}">`).join("");
  return STATIONS;
}
function rowHop(r) {
  const key = r.station + "|" + r.k, c = STN.cache;
  if (key in c) return c[key];
  const list = STN.keys[C.stationKey(r.station)], p = TOWN_CENTER[r.k];
  let hop = null;
  if (list) list.forEach(s => { if ((!p || C.distKm([s.lat, s.lng], p) <= NEAR_KM) && (hop == null || s.hop < hop)) hop = s.hop; });
  return c[key] = hop;
}
function clearStation() {
  STN = null; S.stn = ""; S.stnN = "";
  document.getElementById("fStnN").value = ""; drawStation(); stnMsg("");
}
async function applyStation(fit = true) {
  const D = await loadStations();
  let i = STN_LABEL[S.stn];
  if (i == null) i = D.h.findIndex(h => C.stationKey(h[0]) === C.stationKey(S.stn));
  if (i < 0 || i == null) { stnMsg("該当する駅が見つかりません。候補から選択してください。"); return; }
  const n = +S.stnN, hops = C.stationsWithin(D.a, i, n), keys = {}, pts = [];
  Object.entries(hops).forEach(([id, hop]) => { const h = D.h[id]; pts.push([h[1], h[2]]);
    (keys[C.stationKey(h[0])] ||= []).push({ hop, lat: h[1], lng: h[2] }); });
  const list = Object.values(CITY_INFO).filter(c => c.bbox && pts.some(p => c.bbox[0] - 0.01 <= p[1] && c.bbox[2] + 0.01 >= p[1] && c.bbox[1] - 0.01 <= p[0] && c.bbox[3] + 0.01 >= p[0])).map(c => c.code);
  if (!list.length) { stnMsg("この駅の周辺には相場データがありません（国の取引データに周辺の取引がないか、未収録です）。"); return; }
  if (list.length > MAX_CIRCLE_CITIES) { stnMsg("対象範囲が広すぎます。駅数を減らしてください。"); return; }
  STN = { i, n, hops, keys, pts, cache: {} };
  S.center = null; S.kms = []; syncKm(); circleMsg(""); drawCircle();
  S.cities = S.keep ? [...new Set([...S.cities, ...list])] : list;
  S.sel = null; stnMsg(`${Object.keys(hops).length}駅が対象範囲に含まれます。`);
  drawStation();
  await applyCities(false);
  if (fit) fitTo(L.latLngBounds(pts).pad(0.12));
}

// ---------- 円（半径）。国のデータは町ごとなので、町の代表点が円の中にある町と、中心が入っている町を数える ----------
let INSIDE = null;          // 町 → 中心からの距離（km）。円を使わないときは null
let CENTER_TOWN = null;     // 中心地点を含む町
const TOWN_RINGS = {};      // 町 → 外側の線の並び
const TOWN_CENTER = {};     // 町 → 代表点
const circleOn = () => !!(S.center && S.km);
function computeInside() {
  CENTER_TOWN = null;
  if (STN) { const out = {}; ALL.forEach(r => { const h = rowHop(r); if (h != null && (out[r.k] == null || h < out[r.k])) out[r.k] = h; }); INSIDE = out; return; }
  if (!circleOn()) { INSIDE = null; return; }
  const km = +S.km, out = {};

let breaks = [];
function colorMetric(t) { return S.color === "price" ? t.med : S.color === "liq" ? t.liq : t.perYear; }
function computeBreaks() {
  const vals = Object.values(TOWN).filter(t => t.n >= MIN_N).map(colorMetric).filter(v => v != null);
  breaks = [1, 2, 3, 4, 5].map(i => quant(vals, i / 6));
}
function colorFor(t) {
  if (!t) return NODATA;
  const v = colorMetric(t); if (v == null) return NODATA;

}
function paint() {
  let selLayers = [];

      l.setStyle({ fillColor: out ? NODATA : colorFor(t), fillOpacity: hideTown ? 0 : out ? 0.15 : t && t.n < MIN_N ? 0.35 : 0.72,
        color: sel ? "#a3402a" : hideTown ? "#77736b" : "#ffffff", weight: sel ? 3 : 0.6, dashArray: t && t.n < MIN_N ? "3 3" : null });
      if (sel) selLayers.push(l);
    }); });
  selLayers.forEach(l => l.bringToFront());
  const fmtB = v => S.color === "price" ? (isTotalType() ? fmtMan(v) : man(conv(v)).toFixed(0) + "万円") : v < 1 ? v.toFixed(2) : v.toFixed(1);

  let h = `<b>${title}</b>`;

  if (breaks.length && breaks[0] != null) {
    RAMP.forEach((c, i) => {
      const lo = i === 0 ? null : breaks[i - 1], hi = breaks[i];
      const lo2 = S.color === "price" && !isTotalType() ? fmtB(lo).replace(/万円$/, "") : fmtB(lo);   // 「100〜109万円」のように単位は後ろに1回
      const txt = i === 0 ? `〜${fmtB(hi)}` : i === RAMP.length - 1 ? `${fmtB(lo)}〜` : `${lo2}〜${fmtB(hi)}`;
      h += `<div class="row"><i style="background:${c}"></i>${txt}</div>`;
    });
  }
  h += `<div class="row"><i class="few" style="background:${RAMP[2]};opacity:.5"></i>${MIN_N}件未満（参考値）</div>`;
  h += `<div class="row"><i style="background:${NODATA}"></i>取引なし</div>`;
  if (S.mine && MINE.length) h += `<div class="row"><i class="mine"></i>登録した成約例（数字は件数）</div>`;
  document.getElementById("legend").innerHTML = h;

}

function breakdown(rows, keyFn, order, labels, valFn = mainVal, total = isTotalType()) {
  const g = {};
  for (const r of rows) { const k = keyFn(r); if (k == null || k === "") continue; (g[k] ||= []).push(valFn(r)); }
  const list = order.filter(k => g[k]).map(k => { const st = stats(g[k]); return { k, label: labels ? labels[k] : k, n: g[k].length, med: st.med, st }; });
  if (!list.length) return `<p class="muted">データなし</p>`;
  const max = Math.max(...list.map(x => x.med));
  const f = v => total ? fmtMan(v) : fmtUnitHtml(v);
  return `<table><thead><tr><th></th><th>件数</th><th>${colName(total)}の中央値<span class="alt">最小〜最大</span></th><th></th></tr></thead><tbody>` +
    list.map(x => `<tr class="${x.n < MIN_N ? "few" : ""}"><td>${x.label}</td><td>${x.n}</td><td>${f(x.med)}<span class="alt mm">${fmtRng(x.st.min, x.st.max)}</span></td>` +
      `<td class="bar"><div class="barw"><span style="width:${(x.med / max * 100).toFixed(0)}%"></span></div></td></tr>`).join("") +
    `</tbody></table>`;
}

const PLAN_LABEL = { "1R1K": "1R・1K・1DK", "1LDK": "1LDK・2DK", "2LDK": "2LDK", "3LDK": "3LDK", "4LDK": "4LDK〜" };

// 更地（ふつうの土地）の相場：この町の「土地」の取引から。整形・特別な事情なしで5件あれば、それを使う
function baseLand(k) {
  const code = k ? k.split("|")[0] : S.cities[0];
  const rows = (CITY[code] ? CITY[code].rows : []).filter(r => r.type === "宅地(土地)" && (() => { const [a, b] = C.range(S.year); return r.y >= a && r.y <= b; })());
  const tries = [
    [r => r.k === k && C.shapeGroup(r.shape) === "seikei" && !C.isSpecial(r), "この町の土地（整形・特殊事情なし）"],
    [r => r.k === k && !C.isSpecial(r), "この町の土地（形状問わず・特殊事情なし）"],
    [r => C.shapeGroup(r.shape) === "seikei" && !C.isSpecial(r), cityName(code) + "全体の土地（整形・特殊事情なし）"],
  ];
  for (const [f, label] of tries) {

    if (rs.length >= MIN_N) return { unit: tmed(rs.map(r => r.unit)), n: rs.length, label, area: median(rs.map(r => r.area)) };

}

  [...P.querySelectorAll(":scope > h3")].forEach(h => {

function townFromText(q) {
  const t = q.normalize("NFKC").replace(/\s/g, "");
  let best = null;
  Object.keys(TOWN_CENTER).forEach(k => { const n = k.split("|")[1]; if (n && t.includes(n) && (!best || n.length > best.n.length)) best = { k, n }; });
  return best;
}
async function searchAddr() {
  const q = document.getElementById("fAddr").value.trim(); if (!q) return;
  circleMsg("検索中…");
  try {
    const res = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q)), list = await res.json();
    if (!list || !list.length) { if (useTownFallback(q)) return; circleMsg("該当する住所が見つかりません。市区町村名から入力してください。"); return; }
    const [lng, lat] = list[0].geometry.coordinates;
    circleMsg(list[0].properties.title + " を中心に設定しました。");
    S.center = [lat, lng]; if (!S.km) { S.kms = ["1"]; syncKm(); }
    surveyPoint(lat, lng, q);
    const m = document.getElementById("circleMsg").textContent;
    applyCircle(); if (S.center) circleMsg(m);
  } catch (err) { if (useTownFallback(q)) return; circleMsg("住所を検索できませんでした（国土地理院の住所検索に接続できません）。「地図上で指定」から地点を選択してください。"); }
}
function useTownFallback(q) {
  const b = townFromText(q); if (!b) return false;
  const [lat, lng] = TOWN_CENTER[b.k];
  S.center = [lat, lng]; if (!S.km) { S.kms = ["1"]; syncKm(); }
  surveyPoint(lat, lng, townName(b.k) + "の中心（番地は特定できません）");
  applyCircle(); circleMsg(`住所検索に接続できないため、${wardOf(b.k)} ${townName(b.k)} の中心地点を中心に設定しました。番地の位置は「地図上で指定」で修正できます。`);
  return true;
}
document.getElementById("fAddrGo").onclick = searchAddr;
document.getElementById("fAddr").addEventListener("keydown", e => { if (e.key === "Enter") searchAddr(); });
// 詳細条件（よく使う種類・単位・地図の色・期間以外）は、ふだん閉じておく。指定中の数はボタンに出す
const ADV_IDS = ["fSrc", "fStation", "fWalk", "fArea", "fPlan", "fStruct", "fAge", "fHouse", "fShape", "fRoad", "fWidth", "fFront", "fCp", "fJijo"];
ADV_IDS.forEach(id => { const l = document.getElementById(id).closest("label"); if (l) l.classList.add("adv"); });
document.querySelectorAll("#filters .grp").forEach(g => g.classList.add("adv"));
function advLabel() {
  const f = document.getElementById("filters"), n = ADV_IDS.filter(id => { const e = document.getElementById(id); return e.value && e.value !== "all" && e.value !== "noChosei"; }).length;
  document.getElementById("advBtn").textContent = (f.classList.contains("advopen") ? "詳細条件を閉じる ▴" : "詳細条件 ▾") + (n ? `（${n}件指定中）` : "");
}
document.getElementById("advBtn").onclick = () => { document.getElementById("filters").classList.toggle("advopen"); advLabel(); setTimeout(() => map.invalidateSize(), 50); };
document.getElementById("filters").addEventListener("change", advLabel);
document.getElementById("toggleFilters").onclick = e => {
  const f = document.getElementById("filters"), open = f.classList.toggle("open");
  e.target.setAttribute("aria-expanded", open); e.target.textContent = open ? "条件を閉じる ▴" : "条件を絞り込む ▾";
  setTimeout(() => map.invalidateSize(), 50);
};

refreshArea();
refreshOptions();
advLabel();
let STARTED = false;
const startMap = () => { if (STARTED) return; STARTED = true; (S.stn && S.stnN ? applyStation() : circleOn() ? applyCircle() : applyCities(true)); drawZoning(); };
requestAnimationFrame(startMap);   // 画面の大きさが決まってから地図を合わせる
setTimeout(startMap, 600);         // 裏で開いたタブなど、描く合図が来ないときも読みこみを始める
</script>
